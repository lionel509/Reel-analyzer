[project]
name = "reel-analyzer"
version = "0.1.0"
description = "MCP server that watches a short-form video and returns a transcript plus a visual description."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lionel Weng" }]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "python-dotenv>=1.0",
]

[project.scripts]
reel-analyzer = "reel_analyzer.server:main"
reel-analyzer-configure = "reel_analyzer.configure:main"
reel-analyzer-smoke = "reel_analyzer.smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_analyzer"]
